# Alembic configuration for the HeritageGraph AI schema (Module C, C1).
#
# The database URL is NEVER stored here: it is supplied at runtime by
# `python -m app.db.init_db` or the DATABASE_URL environment variable
# (see database/migrations/env.py) — no fabricated credentials, matching
# the B1 configuration rules.
[alembic]
script_location = %(here)s/migrations
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
