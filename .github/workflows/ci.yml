# HeritageGraph AI — continuous integration
#
# The same commands the README documents, run on every push and pull request:
# the backend suite (mocked providers, real migrated SQLite), the frontend
# suite, the type check and the production build. No credentials are needed —
# live provider and live source tests are opt-in and stay skipped here.
#
# Live checks that cannot run in CI (they need keys and network): Google Cloud
# Vision OCR, the vision provider, real MediaWiki retrieval and the
# real-browser check (`npm run check:browser`). Those are run locally and
# reported in the README rather than pretended to run here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        # No secrets, no .env: every provider is mocked or opt-in, and each
        # database test runs its own migrations against a temporary SQLite file.
        run: python -m pytest -q

  frontend:
    name: Frontend tests, types and build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run the test suite
        run: npm test

      - name: Production build
        run: npm run build
